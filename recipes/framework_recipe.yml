# image will be published to ghcr.io/<user>/<name>
name: uhypr
# description will be included in the image's metadata
description: custom sway image for framework laptop.

# the base image to build on top of (FROM) and the version tag to use
# base-image: quay.io/fedora/fedora-sway-atomic
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 42

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: common.yml
  - type: brew
    nofile-limits: true # increase nofile limits
    brew-analytics: false # disable telemetry
  - type: chezmoi
    repository: "https://github.com/gerblesh/dotfiles" # my dotfiles repo
    all-users: true # make users have to enable chezmoi manually
    file-conflict-policy: replace # override changed files with those from the repo
    disable-update: true
    disable-init: false
